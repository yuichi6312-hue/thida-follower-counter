<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>THIDA フォロワーカウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one landscape screen — sun in the corner, giant count left, follow-QR card right, today's gain + next milestone underneath */
:root{
  --sea:#0d1b2a; --sea-2:#14283d;
  --sun:#ffb238; --sun-hot:#ff7a2f;
  --foam:#f3efe6; --mist:#8fa3b8; --up:#6fdc8c; --down:#ff8a7a;
  --f-num:"Big Shoulders Display","Oswald","Impact",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 100% 0%, var(--sea-2) 0%, var(--sea) 60%);
  color:var(--foam);font-family:var(--f-jp);overflow:hidden;
  padding:env(safe-area-inset-top,0) max(24px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(24px,env(safe-area-inset-left,0px));
}
.sun{position:fixed;top:-22vmin;right:-22vmin;width:64vmin;height:64vmin;border-radius:50%;
  background:radial-gradient(circle, var(--sun) 0 38%, rgba(255,178,56,.25) 39% 48%, rgba(255,178,56,.08) 49% 62%, transparent 63%);
  pointer-events:none;transition:transform .8s cubic-bezier(.2,1.6,.4,1)}
.sun.burst{transform:scale(1.18)}
.rays{position:fixed;top:-22vmin;right:-22vmin;width:64vmin;height:64vmin;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,178,56,.10) 0 6deg, transparent 6deg 18deg);border-radius:50%;
  mask:radial-gradient(circle, transparent 48%, #000 49%);-webkit-mask:radial-gradient(circle, transparent 48%, #000 49%);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-block:4vh 6vh;position:relative}
header{display:flex;align-items:center;gap:14px}
.ig{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--sun),var(--sun-hot));color:var(--sea)}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:clamp(16px,2.4vmin,26px);letter-spacing:.04em}
.brand span{font-size:clamp(12px,1.8vmin,18px);color:var(--mist)}

.middle{display:flex;align-items:center;justify-content:space-between;gap:4vmin;min-width:0}
.center{min-width:0}
.label{font-size:clamp(14px,2.6vmin,28px);font-weight:700;color:var(--sun);letter-spacing:.3em;margin-left:.4vmin}
.count{font-family:var(--f-num);font-weight:900;font-size:clamp(96px,28vmin,340px);line-height:.9;
  display:flex;font-variant-numeric:tabular-nums;user-select:none}
.digit{position:relative;display:inline-block;width:.56em;height:.9em;overflow:hidden}
.digit .strip{position:absolute;left:0;top:0;display:flex;flex-direction:column;transition:transform 1.1s cubic-bezier(.2,.9,.25,1)}
.digit .strip span{height:.9em;display:block;text-align:center}
.comma{width:.24em;display:inline-block;color:var(--mist)}

.qr{flex:none;background:var(--foam);color:var(--sea);border-radius:20px;padding:2.2vmin;
  display:flex;flex-direction:column;align-items:center;gap:1.2vmin;width:clamp(170px,30vmin,330px);
  box-shadow:0 0 0 6px rgba(255,178,56,.35)}
.qr .code{width:100%;aspect-ratio:1;max-width:100%}
.qr .code svg{width:100%;height:100%;display:block}
.qr b{font-size:clamp(14px,2.4vmin,24px);letter-spacing:.06em}
.qr span{font-size:clamp(11px,1.7vmin,16px);color:#4a5b6c;word-break:break-all;text-align:center}

.stats{display:flex;flex-wrap:wrap;gap:3vmin 6vmin;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.stat small{font-size:clamp(12px,1.9vmin,20px);color:var(--mist);letter-spacing:.12em}
.stat strong{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,7vmin,84px);line-height:1}
.gain{color:var(--up)} .gain.zero{color:var(--foam)} .gain.down{color:var(--down)}
.goal{flex:1 1 280px}
.bar{height:12px;border-radius:6px;background:rgba(243,239,230,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun-hot),var(--sun));transition:width 1.2s ease}
.goal strong{font-size:clamp(24px,4.6vmin,52px)}

.foot{position:fixed;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--mist)}
.foot .btns{display:flex;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
.dot.warn{background:var(--sun)}
.demo{color:var(--sun);font-weight:700}
.ghost{background:none;border:1px solid rgba(143,163,184,.4);color:var(--mist);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* settings */
dialog{border:none;border-radius:18px;padding:0;background:var(--sea-2);color:var(--foam);width:min(460px,calc(100vw - 32px));
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,10,18,.7)}
.panel{padding:24px;display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-size:20px}
.panel p.hint{margin:0;font-size:13px;color:var(--mist);line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field small{font-size:12px;color:var(--mist);line-height:1.5}
.field input{background:var(--sea);border:1px solid rgba(143,163,184,.35);color:var(--foam);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--sun)}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.primary{background:var(--sun);color:var(--sea);border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.5;cursor:wait}
.msg{font-size:13px;min-height:1.4em;margin:0}
.msg.ok{color:var(--up)} .msg.err{color:var(--down)}
hr{border:none;border-top:1px solid rgba(143,163,184,.2);margin:0}

@media (orientation:portrait){
  .middle{flex-direction:column;align-items:flex-start}
  .count{font-size:clamp(80px,24vw,300px)}
  .qr{align-self:center}
  .stats{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){ .rays{animation:none}.digit .strip,.sun,.bar i{transition:none} }
</style>
</head>
<body>
<div class="rays" aria-hidden="true"></div>
<div class="sun" id="sun" aria-hidden="true"></div>
<main>
  <header>
    <div class="ig" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="brand"><b id="brand">THIDA TRAINING GYM</b><span id="user">@instagram</span></div>
  </header>

  <div class="middle">
    <section class="center">
      <div class="label">FOLLOWERS</div>
      <div class="count" id="count" aria-live="polite"></div>
    </section>
    <aside class="qr" id="qr">
      <div class="code" id="qrcode" role="img" aria-label="InstagramプロフィールのQRコード"></div>
      <b>フォローはこちら</b>
      <span id="qrUser">@instagram</span>
    </aside>
  </div>

  <section class="stats">
    <div class="stat"><small>今日の増加</small><strong class="gain zero" id="gain">±0</strong></div>
    <div class="stat goal"><small id="goalLabel">次の目標</small><strong id="goalRest">—</strong><div class="bar"><i id="bar"></i></div></div>
  </section>
</main>
<div class="foot">
  <span><span class="dot" id="dot"></span><span id="status">接続中…</span></span>
  <span class="btns">
    <button class="ghost" id="fs" type="button">全画面</button>
    <button class="ghost" id="openSettings" type="button">設定</button>
  </span>
</div>

<dialog id="settings">
  <form class="panel" id="settingsForm" method="dialog">
    <h2>設定</h2>

    <label class="check"><input type="checkbox" id="showQr" checked> フォロー用QRコードを表示する</label>
    <hr>
    <p class="hint">ここから下の変更はサーバーに保存されます。保存にはパスコードが必要です。</p>
    <div class="field">
      <label for="displayName">表示名</label>
      <input id="displayName" maxlength="40" placeholder="THIDA TRAINING GYM">
    </div>
    <div class="field">
      <label for="newToken">Instagramのトークン（アカウントを変えるとき）</label>
      <input id="newToken" type="password" autocomplete="off" placeholder="変えない場合は空欄">
      <small>切り替えたいアカウントでMeta for Developersから発行したトークンを貼り付けます。保存すると、そのアカウントのフォロワー数とQRコードに切り替わります。</small>
    </div>
    <div class="field">
      <label for="passcode">パスコード</label>
      <input id="passcode" type="password" autocomplete="current-password" required>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <div class="row">
      <button class="ghost" type="button" id="closeSettings">閉じる</button>
      <button class="primary" type="submit" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
const API = "https://ujrssjdbplvkfdesuxng.supabase.co/functions/v1/ig-followers";
const POLL_MS = 60 * 1000;
const $ = id => document.getElementById(id);
let shown = null, currentUser = null, currentDisplay = null;

/* ---------- local settings (this tablet only) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(_) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} }
};
function applyQrVisibility(){ $("qr").hidden = !store.get("showQr", true); }
applyQrVisibility();

/* ---------- counter ---------- */
function renderCount(n){
  const el = $("count"), str = n.toLocaleString("en-US");
  if (el.dataset.len !== String(str.length)) {
    el.innerHTML = "";
    for (const ch of str) {
      if (ch === ",") { const c = document.createElement("span"); c.className = "comma"; c.textContent = ","; el.appendChild(c); continue; }
      const d = document.createElement("span"); d.className = "digit";
      const s = document.createElement("span"); s.className = "strip";
      for (let i = 0; i <= 9; i++) { const x = document.createElement("span"); x.textContent = i; s.appendChild(x); }
      d.appendChild(s); el.appendChild(d);
    }
    el.dataset.len = str.length;
    requestAnimationFrame(() => setDigits(el, str));
  } else setDigits(el, str);
  el.setAttribute("aria-label", str);
}
function setDigits(el, str){
  const strips = el.querySelectorAll(".strip"); let k = 0;
  for (const ch of str) { if (ch === ",") continue; strips[k++].style.transform = `translateY(-${Number(ch) * 0.9}em)`; }
}
function nextGoal(n){
  const step = n < 1000 ? 100 : n < 10000 ? 500 : n < 100000 ? 1000 : 10000;
  const goal = Math.floor(n / step) * step + step;
  return { goal, prev: goal - step };
}

/* ---------- QR ---------- */
function renderQr(username){
  if (!username || username === currentUser) return;
  currentUser = username;
  $("user").textContent = $("qrUser").textContent = "@" + username;
  const url = "https://www.instagram.com/" + encodeURIComponent(username) + "/";
  try {
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    $("qrcode").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    $("qrcode").setAttribute("aria-label", url + " のQRコード");
  } catch (_) { $("qrcode").textContent = url; }
}

function render(d){
  const n = d.followers_count;
  if (shown !== null && n > shown) { const s = $("sun"); s.classList.add("burst"); setTimeout(() => s.classList.remove("burst"), 900); }
  renderCount(n); shown = n;
  renderQr(d.username);
  if (d.display_name) { currentDisplay = d.display_name; $("brand").textContent = d.display_name; }
  const g = $("gain");
  if (d.today_start != null) {
    const diff = n - d.today_start;
    g.textContent = (diff > 0 ? "+" : diff < 0 ? "−" : "±") + Math.abs(diff).toLocaleString();
    g.className = "gain" + (diff > 0 ? "" : diff < 0 ? " down" : " zero");
  }
  const { goal, prev } = nextGoal(n);
  $("goalLabel").textContent = `次の目標 ${goal.toLocaleString()}人まで`;
  $("goalRest").textContent = `あと ${(goal - n).toLocaleString()}人`;
  $("bar").style.width = ((n - prev) / (goal - prev) * 100).toFixed(1) + "%";
}
function setStatus(html, ok){ $("status").innerHTML = html; $("dot").className = "dot" + (ok ? "" : " warn"); }

let demo = 1234;
function showDemo(reason, displayName){
  demo += Math.random() < .5 ? 1 : 0;
  render({ followers_count: demo, today_start: 1229, username: "thida_training_gym", display_name: displayName });
  setStatus(`<span class="demo">サンプル表示</span>　${reason}`, false);
}

async function tick(){
  try {
    const r = await fetch(API, { cache: "no-store" });
    const d = await r.json();
    if (d.error === "no_token") return showDemo("Instagramのトークンが未設定です（設定から登録できます）", d.display_name);
    if (!r.ok || typeof d.followers_count !== "number") throw new Error(d.detail || d.error || r.status);
    render(d);
    const t = new Date(d.fetched_at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    setStatus(d.stale ? `前回の数字を表示中（${t} 取得）` : `${t} 更新`, !d.stale);
  } catch (e) {
    if (shown === null) showDemo("サーバーに接続できません");
    else setStatus("接続を再試行中…", false);
  }
}
tick(); setInterval(tick, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); keepAwake(); } });

/* ---------- screen ---------- */
let lock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch (_) {} }
keepAwake();
$("fs").addEventListener("click", async () => {
  keepAwake();
  try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch (_) {}
});

/* ---------- settings ---------- */
const dlg = $("settings"), msg = (t, cls) => { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); };
$("openSettings").addEventListener("click", () => {
  $("showQr").checked = store.get("showQr", true);
  $("displayName").value = currentDisplay || "";
  $("newToken").value = ""; msg("");
  dlg.showModal();
});
$("closeSettings").addEventListener("click", () => dlg.close());
$("showQr").addEventListener("change", e => { store.set("showQr", e.target.checked); applyQrVisibility(); });

$("settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const body = { passcode: $("passcode").value };
  const name = $("displayName").value.trim();
  if (name !== (currentDisplay || "")) body.display_name = name;
  const token = $("newToken").value.trim();
  if (token) body.token = token;
  if (!body.display_name && body.display_name !== "" && !body.token) { msg("変更はありません。", "ok"); return; }
  $("save").disabled = true; msg("保存中…");
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      msg(d.username ? `@${d.username} に切り替えました。` : "保存しました。", "ok");
      $("newToken").value = "";
      currentUser = null; shown = null;
      await tick();
    } else {
      const map = {
        wrong_passcode: "パスコードが違います。",
        no_passcode_set: "パスコードがまだ登録されていません。Supabaseで設定してください。",
        invalid_token: "このトークンではInstagramに接続できませんでした。プロアカウントのトークンか確認してください。"
      };
      msg(map[d.error] || "保存できませんでした。時間をおいてもう一度お試しください。", "err");
    }
  } catch (_) { msg("サーバーに接続できません。ネット接続を確認してください。", "err"); }
  $("save").disabled = false;
});
</script>
</body>
</html>
